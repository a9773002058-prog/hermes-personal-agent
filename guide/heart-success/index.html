<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Спасибо за покупку | Dr(RUS) Veronika Sagitova</title>
  <style>
    :root{--ink:#142238;--deep:#1d4263;--blue:#447fb4;--gold:#c5a04a;--paper:#f4f7fb;--white:#fff;--line:#d9e5f0}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:linear-gradient(145deg,#eaf2f9,var(--paper));color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.65}
    main{width:min(680px,100%);background:var(--white);border:1px solid var(--line);border-radius:24px;padding:clamp(32px,7vw,64px);text-align:center;box-shadow:0 22px 60px rgba(24,54,86,.12)}
    .mark{width:68px;height:68px;display:grid;place-items:center;margin:0 auto 24px;border-radius:50%;background:var(--deep);color:var(--white);font-size:2rem;font-weight:800}
    h1{margin:0 0 18px;font-size:clamp(2rem,6vw,3.2rem);line-height:1.12}
    p{margin:0 auto 12px;max-width:520px;color:#526276;font-size:1.08rem}
    .guide{color:var(--ink);font-weight:750}
    .download{display:inline-block;margin-top:24px;padding:15px 26px;border-radius:9px;background:var(--deep);color:var(--white);font-weight:800;text-decoration:none;opacity:.55;cursor:not-allowed}
    .note{margin-top:14px;font-size:.84rem;color:#718094}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✓</div>
    <h1>Спасибо за покупку!</h1>
    <p>Оплата успешно завершена.</p>
    <p class="guide">Ваш образовательный гайд «Здоровье сердца» доступен для скачивания.</p>
    <span class="download" aria-disabled="true">Скачать гайд PDF</span>
    <p class="note">Ссылка на PDF будет добавлена здесь.</p>
  </main>
</body>
</html>
